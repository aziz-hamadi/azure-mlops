$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: model
command: >-
  python train.py
  --training_data ${{inputs.training_data}}
  --reg_rate ${{inputs.reg_rate}}
inputs:
  training_data:
    type: uri_folder
    path: ${AML_DATA_PATH_PROD}
  reg_rate: 0.01
environment: azureml://registries/azureml/environments/sklearn-1.5/versions/35
compute: azureml:classification-cluster-prod
experiment_name: training-job-with-github-actions-prod
description: simple classification training job with github actions for production
display_name: classification-diabetes-prod
tags:
    training: classification
    framework: sklearn
    environment: production