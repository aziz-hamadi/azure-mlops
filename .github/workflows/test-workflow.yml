name: push trigger for a local workflow

on:
  workflow_dispatch:

jobs:
  train-prod:
    name: Train on Prod Cluster
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      job_name: ${{ steps.train.outputs.job_name }}

    steps:
      - name: Check out repo
        uses: actions/checkout@main

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Run AML job on Prod
        id: train
        run: |
          job_name=$(az ml job create --file src/job-prod.yml --resource-group ${{ vars.RSGROUP_PROD }} --workspace-name ${{ vars.WORKSPACE_PROD }} --query name --output tsv)
          az ml job stream --name "$job_name" --resource-group ${{ vars.RSGROUP_PROD }} --workspace-name ${{ vars.WORKSPACE_PROD }}
          echo "job_name=$job_name" >> $GITHUB_OUTPUT

  register-model:
    name: Register Model
    needs: train-prod
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      model_name: ${{ steps.register.outputs.model_name }}

    steps:
      - name: Check out repo
        uses: actions/checkout@main

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate Model YAML from Template
        run: |
          model_name="${{ needs.train-prod.outputs.job_name }}-model-prod"
          model_path="azureml://jobs/${{ needs.train-prod.outputs.job_name }}/outputs/artifacts/paths/model/"

          # Replace placeholders in template
          sed -e "s|<name-for-model>|$model_name|g" \
              -e "s|<path-to-your-model>|$model_path|g" \
              azure-templates/model-template.yml > model-config.yml

          echo "Generated model-config.yml:"
          cat model-config.yml

      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Register AML Model
        id: register
        run: |
          model_name="${{ needs.train-prod.outputs.job_name }}-model-prod"
          az ml model create --file model-config.yml --resource-group ${{ vars.RSGROUP_PROD }} --workspace-name ${{ vars.WORKSPACE_PROD }}
          echo "model_name=$model_name" >> $GITHUB_OUTPUT
          echo "DEBUG: Registered model: $model_name"

  create-or-check-endpoint:
    name: Create Endpoint
    needs: register-model
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      endpoint_name: ${{ steps.check-endpoint.outputs.endpoint_name }}

    steps:
      - name: Check out repo
        uses: actions/checkout@main

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Check if Endpoint Exists
        id: check-endpoint
        run: |
          # Debug: Check what we're getting from previous job
          echo "DEBUG: needs.register-model.outputs.model_name = '${{ needs.register-model.outputs.model_name }}'"
              
          endpoint_name="${{ needs.register-model.outputs.model_name }}-endpoint"
              
          # Azure ML requires lowercase, alphanumeric and hyphens only
          # Replace underscores with hyphens and convert to lowercase
          endpoint_name=$(echo "$endpoint_name" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
              
          echo "DEBUG: Constructed endpoint_name = '$endpoint_name'"
              
          if [ -z "$endpoint_name" ] || [ "$endpoint_name" = "-endpoint" ]; then
            echo "ERROR: endpoint_name is empty or invalid!"
            echo "This means model_name from register-model job is not being passed correctly"
            exit 1
          fi
    
    echo "Checking endpoint: $endpoint_name"

    # Try to get endpoint, suppress error output
    if az ml online-endpoint show --name "$endpoint_name" --resource-group "${{ vars.RSGROUP_PROD }}" --workspace-name "${{ vars.WORKSPACE_PROD }}" > /dev/null 2>&1; then
      echo "endpoint_exists=true" >> $GITHUB_OUTPUT
      echo "✓ Endpoint '$endpoint_name' exists"
    else
      echo "endpoint_exists=false" >> $GITHUB_OUTPUT
      echo "✗ Endpoint '$endpoint_name' does not exist (will create)"
    fi

    echo "endpoint_name=$endpoint_name" >> $GITHUB_OUTPUT
    echo "DEBUG: Set GITHUB_OUTPUT endpoint_name=$endpoint_name"

      - name: Create Endpoint (if needed)
        if: steps.check-endpoint.outputs.endpoint_exists == 'false'
        run: |
          endpoint_name="${{ steps.check-endpoint.outputs.endpoint_name }}"
          echo "Creating new endpoint: $endpoint_name"
              
          az ml online-endpoint create --name "$endpoint_name" --auth-mode key --resource-group "${{ vars.RSGROUP_PROD }}" --workspace-name "${{ vars.WORKSPACE_PROD }}"
              
          echo "✓ Endpoint created successfully"

  deploy-model:
    name: Deploy Model to Endpoint
    needs: [register-model, create-or-check-endpoint]
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@main

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Generate Deployment YAML from Template
        run: |
          endpoint_name="${{ needs.create-or-check-endpoint.outputs.endpoint_name }}"
          model_name="${{ needs.register-model.outputs.model_name }}"
          deployment_name="blue-deployment"
          model_path=$(az ml model show --name $model_name --version 1 --query path -o tsv --resource-group ${{ vars.RSGROUP_PROD }} --workspace-name ${{ vars.WORKSPACE_PROD }})

          sed -e "s|<endpoint-name>|$endpoint_name|g" \
              -e "s|<model-name>|$model_name|g" \
              -e "s|<deployment-name>|$deployment_name|g" \
              -e "s|<model-path>|$model_path|g" \
              azure-templates/deployment-template.yml > deployment-config.yml

          echo "Generated deployment-config.yml:"
          cat deployment-config.yml

      - name: Deploy Model to Endpoint
        run: |
          az ml online-deployment create --file deployment-config.yml --all-traffic --resource-group ${{ vars.RSGROUP_PROD }} --workspace-name ${{ vars.WORKSPACE_PROD }}
